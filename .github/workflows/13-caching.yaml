name: 13 - using caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to exicute cache steps
        type: boolean
        default: true
      node-version:
        description: Node version
        type: choice 
        options:
          - 18.x
          - 20.x
          - 21.x
        default: 20.x



jobs:
  build:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download cached Dependencies
        uses: actions/cache@v3
      - name: install Dependencies
        run: npm ci
      - name: testing
        run: npm run test
      - name: building
        run: npm run build
      - name: deploy into nonprod
        run: echo "Deploying to nonprod"
        

