jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: echo "${{ github.event.pull_request.title }}"

      - name: Print PR labels
        run: |
          cat << EOF
          ${{ toJSON(github.event.pull_request.labels) }}
          EOF

      - name: Bug step
        if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
        run: echo "I am a Bug fix"

      - name: Failing step
        run: exit 1

      - name: I will be skipped
        if: ${{ success() }}
        run: echo "I will print if previous steps succeed"

      - name: I will execute
        if: ${{ failure() }}
        run: echo "I will print if any previous step fails"

      - name: I will execute unless canceled
        if: ${{ !cancelled() }}
        run: echo "I will print, except when the workflow is canceled"

      - name: I will execute only if canceled
        if: ${{ cancelled() }}
        run: echo "I will print, if the workflow is canceled"