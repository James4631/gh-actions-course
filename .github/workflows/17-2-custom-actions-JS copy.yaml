name: 17 - 3 custom actions - docker
on:
  workflow_dispatch:
    inputs:
      url:
        type: string
        default: "https://www.google.com"

jobs:
  ping:
    runs-on: ubuntu-latest
   
    steps:
      - uses: actions/checkout@v4
      - name: Ping Url
        uses: ./.github/actions/docker-ping-url
        with:
          url: ${{ inputs.url }} 
          