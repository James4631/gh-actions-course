name: 10 - Exicution Flows

on:
  workflow_dispatch:
    inputs:
      pass-unit-test:
        type: boolean
        description: whether unit tests will pass or not
        default: true


jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and Build
        run: echo "Linting and Building project"
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Runing unit tests
        run: echo "Runing tests..."
      - name: Failing tests
        if: ${{ !inputs.pass-unit-tests }}
        run: exit 1
  deploy-nonprod:
    runs-on: ubuntu-latest
    needs: 
      - lint-build
      - unit-test
    steps:
      - name: Deploying to nonprod
        run: echo "Deploying to nonprod"
  e2e-tests:
    runs-on: ubuntu-latest
    needs: 
      - deploy-nonprod
    steps:
      - name: Runing E2E tests
        run: echo " running e2e testss....."
  load-tests: 
    runs-on: ubuntu-latest
    needs: 
      - deploy-nonprod
    steps:
      - name: Runing load tests
        run: echo " running load testss....."
  deploy-prod:
    runs-on: ubuntu-latest
    needs: 
      - load-tests
      - e2e-tests