name: Ping Url
description: Ping url until maximum trials have exceeded.If result is not 200 then, fails the actions.

inputs:
  url:
    description: Url to ping.
    required: true
  max_trials:
    description: Maximum number of trials until action fails
    default: '10'
    required: false
  delay:
    description: Delay in seconds between trials.
    default: '5'
    required: false

runs:
  using: docker
  image: Dockerfile
  